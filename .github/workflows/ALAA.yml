name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Project, Resolve Kotlin Conflict, and Build APK
        run: |
          # 1. البحث عن مجلد المشروع (مجلد android)
          PROJECT_DIR=$(find . -maxdepth 3 -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi
          echo "Project directory found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 2. إنشاء ملف حل تضارب مكتبات Kotlin (Duplicate class kotlin-stdlib)
          cat << 'EOF' > fix-kotlin.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

          # 3. إنشاء debug.keystore إذا كان مفقوداً
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            mkdir -p app
            cp debug.keystore app/debug.keystore
          fi

          # 4. تشغيل البناء مع تمرير ملف حل التضارب (-I fix-kotlin.gradle)
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug -I fix-kotlin.gradle --stacktrace
          else
            gradle wrapper
            chmod +x ./gradlew
            ./gradlew assembleDebug -I fix-kotlin.gradle --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
