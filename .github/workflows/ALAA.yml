name: Build Android APK from Web App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب ملفات المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. إعداد بيئة Java 17 المطلوبة لبناء الأندرويد
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. تثبيت حزم المشروع وبناء نسخة الويب (مع تجاوز تعارض الإصدارات)
      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps
          npm run build

      # 5. تثبيت وتهيئة Capacitor لتحويل الويب إلى أندرويد تلقائياً
      - name: Setup Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "Alaa Aldaami" "com.alaa.aldaami.app" --web-dir=dist
          npx cap add android
          npx cap sync android

      # 6. بناء ملف APK
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 7. رفع ملف APK للتحميل
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
