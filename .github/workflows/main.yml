name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب ملفات المشروع من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java 17 (المطلوبة لأحدث مشاريع أندرويد و Gradle)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. منح صلاحية التنفيذ لملف gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. بناء ملف APK (نسخة Debug جاهزة للتثبيت المباشر)
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5. رفع ملف APK الناتج لتتمكن من تحميله
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
